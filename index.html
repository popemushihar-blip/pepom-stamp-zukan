<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f1e9"><title>ぺぽむのスタンプ図鑑</title>
<style>
:root{--bg:#fbf7f1;--paper:#fffdf9;--ink:#574a46;--muted:#8c7a73;--pink:#dca9ad;--pink2:#f4e0df;--line:#eee1d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.7}
header{padding:38px 18px 32px;text-align:center;background:linear-gradient(145deg,#f8e9e5,#f7eee2);border-bottom:1px solid var(--line)}.kicker{font-size:12px;letter-spacing:.16em;color:#987c79;margin:0 0 8px}h1{font-size:clamp(25px,6vw,36px);line-height:1.35;margin:0;font-weight:750;letter-spacing:.04em}.intro{font-size:14px;color:#796a64;margin:12px auto 20px;max-width:28em}.cta{display:inline-block;padding:11px 20px;border-radius:999px;background:#bd858b;color:white;text-decoration:none;font-size:14px;font-weight:700}
main{max-width:900px;margin:0 auto;padding:24px 16px 54px}input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:var(--paper);font-size:16px;color:var(--ink)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}.chip{border:1px solid #e8d8d2;background:var(--paper);color:#796963;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}.chip[aria-pressed=true]{background:var(--pink2);border-color:#dca9ad;color:#704e52}.panel{padding:28px 18px;text-align:center;border:1px dashed #dfc9c1;background:rgba(255,253,249,.8);border-radius:20px}.paw{font-size:30px;margin-bottom:8px}.panel h2{font-size:18px;margin:0 0 8px}.panel p{font-size:14px;color:var(--muted);margin:0 auto;max-width:34em}.note{font-size:12px;color:#9b8981;text-align:center;margin-top:20px}footer{text-align:center;padding:24px 14px;color:#9b8981;font-size:12px;border-top:1px solid var(--line)}
</style></head><body><header><p class="kicker">PEPOMU'S STAMP COLLECTION</p><h1>ぺぽむのスタンプ図鑑</h1><p class="intro">お気に入りのスタンプや絵文字を、ゆっくり見つけてね 🐾</p><a class="cta" href="https://line.me/S/shop/sticker/author/919743" target="_blank" rel="noopener noreferrer">LINE STOREで作品を見る ↗</a></header>
<main><input id="search" type="search" placeholder="作品名・動物・キーワードで検索" aria-label="作品を検索"><div class="filters" aria-label="作品の種類"><button class="chip" data-filter="all" aria-pressed="true">すべて</button><button class="chip" data-filter="sticker" aria-pressed="false">スタンプ</button><button class="chip" data-filter="emoji" aria-pressed="false">絵文字</button></div>
<section class="panel" aria-live="polite"><div class="paw">🐾</div><h2>図鑑を準備中です</h2><p>販売中の作品を確認しながら、少しずつ追加していくね。作品がそろうまでは、上のボタンからLINE STOREで見られるよ。</p></section><p class="note">作品情報は確認できたものから掲載します。</p></main><footer>ぺぽむのスタンプ図鑑</footer>
<script>const search=document.querySelector('#search');const chips=[...document.querySelectorAll('.chip')];function update(){const q=search.value.trim().length>0;document.querySelector('.panel h2').textContent=q?'作品を準備中です':'図鑑を準備中です';document.querySelector('.panel p').textContent=q?'作品データを追加すると、キーワードで探せるようになります。':'販売中の作品を確認しながら、少しずつ追加していくね。作品がそろうまでは、上のボタンからLINE STOREで見られるよ。'}search.addEventListener('input',update);chips.forEach(b=>b.addEventListener('click',()=>{chips.forEach(c=>c.setAttribute('aria-pressed',String(c===b)));update()}));</script></body></html>
