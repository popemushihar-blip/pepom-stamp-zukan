<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ぺぽむのスタンプ図鑑</title>
<style>
:root{--bg:#fffdf7;--hero:#faeab9;--card:#ffffff;--blue:#8ccdf0;--blue-soft:#f7f7f5;--ink:#8b7f73;--line:#e9dfc9;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;padding:18px 16px 42px;max-width:1240px;margin-inline:auto}
.site-header{margin:0 0 22px;text-align:center}
.site-header img{display:block;width:100%;height:auto;max-height:390px;object-fit:contain;border-radius:14px}
/* Main image already contains the site title, so no duplicate text heading. */
.controls{background:#fffdf8;border:1px solid #f0e7d4;border-radius:20px;padding:18px;margin-bottom:20px;box-shadow:0 3px 14px rgba(139,127,115,.05)}
input[type=search]{display:block;width:100%;padding:12px 16px;border-radius:24px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-family:inherit}
input[type=search]::placeholder{color:#b5aa9e}
.filter-label{font-size:14px;font-weight:700;margin:15px 0 8px;color:#786f65}
.row{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;overflow:visible}
button.chip{border:1px solid #e6dfd4;background:#fff;color:var(--ink);padding:8px 15px;border-radius:22px;font-size:14px;font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s}
button.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
#count{font-size:13px;margin:0 2px 12px;color:#9a8f82}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{min-width:0;background:var(--card);border:1px solid #eee4d0;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:9px;box-shadow:0 3px 12px rgba(139,127,115,.045)}
.img{aspect-ratio:1;border-radius:13px;background:var(--blue-soft);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:8px;overflow:hidden;color:#a59a8f}
.img img{width:100%;height:100%;object-fit:contain}
.name{font-size:14px;line-height:1.45;font-weight:700;word-break:break-word;color:#786f65}
.meta{font-size:11px;line-height:1.5;color:#9b9085}
a.buy{margin-top:auto;text-align:center;background:var(--blue);color:#fff;text-decoration:none;padding:9px 8px;border-radius:22px;font-size:13px;font-weight:600}
a.buy:hover{background:#72bde6}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(min-width:700px){body{padding:24px 24px 48px}.controls{padding:22px 24px}#grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:12px}.name{font-size:15px}}
@media(min-width:1050px){.catalog-layout{display:grid;grid-template-columns:minmax(280px, .8fr) minmax(0,2fr);gap:24px;align-items:start}.controls{position:sticky;top:16px;margin-bottom:0}#grid{grid-template-columns:repeat(3,minmax(0,1fr))}.results #count{margin-top:2px}}
@media(max-width:380px){body{padding-left:10px;padding-right:10px}.controls{padding:13px}.row{gap:6px}button.chip{padding:7px 11px;font-size:13px}}
</style></head><body>
<header class="site-header">
<img src="main-design.png.PNG" alt="ぺぽむのスタンプ図鑑 メイン画像">
</header>
<div class="catalog-layout">
<section class="controls" aria-label="作品の検索と絞り込み">
<input type="search" id="q" placeholder="作品名やジャンルで検索" aria-label="検索">
<div class="filter-label">種類から探す</div>
<div class="row" id="types"></div>
<div class="filter-label">ジャンルから探す</div>
<div class="row" id="genres"></div>
</section>
<section class="results" aria-label="作品一覧">
<div id="count"></div>
<div id="grid"></div>
</section>
</div>
<script>
let W=[],type="すべて",genre="すべて";
const $=id=>document.getElementById(id);
function chips(el,list,cur,set){el.innerHTML="";list.forEach(v=>{const b=document.createElement("button");b.className="chip";b.textContent=v;b.setAttribute("aria-pressed",v===cur);b.onclick=()=>{set(v);render()};el.appendChild(b)})}
function card(w){
 const c=document.createElement("div");c.className="card";
 const box=document.createElement("div");box.className="img";
 const ph=()=>{box.textContent="画像未確認"};
 if(w.image){const im=new Image();im.alt=w.name;im.loading="lazy";im.onerror=()=>{if(!im.dataset.fallback&&w.type==="絵文字"&&w.image.includes("/sticonshop/")&&w.image.includes("/iPhone/main.png")){im.dataset.fallback="1";im.src=w.image.replace("/iPhone/main.png","/LINEStorePC/main.png")}else{ph()}};box.appendChild(im);im.src=w.image}else ph();
 const n=document.createElement("div");n.className="name";n.textContent=w.name;
 const m=document.createElement("div");m.className="meta";m.textContent=w.type+"｜"+w.genres.join("・");
 const a=document.createElement("a");a.className="buy";a.href=w.url;a.target="_blank";a.rel="noopener";a.textContent="LINE STOREで見る";
 c.append(box,n,m,a);return c}
function render(){
 const k=$("q").value.trim().toLowerCase();
 const types=["すべて",...new Set(W.map(w=>w.type))];
 const base=W.filter(w=>type==="すべて"||w.type===type);
 const gs=["すべて",...new Set(base.flatMap(w=>w.genres))];
 if(!gs.includes(genre))genre="すべて";
 chips($("types"),types,type,v=>type=v);chips($("genres"),gs,genre,v=>genre=v);
 const list=base.filter(w=>(genre==="すべて"||w.genres.includes(genre))&&(!k||(w.name+w.genres.join("")+w.type+(w.search_terms||[]).join(" ")).toLowerCase().includes(k)));
 $("count").textContent=list.length+"件 / 全"+W.length+"件";
 const g=$("grid");g.innerHTML="";list.forEach(w=>g.appendChild(card(w)));
 if(!list.length)g.textContent="該当する作品がありません。条件を変えてみてください。"}
$("q").addEventListener("input",render);
fetch("works.json").then(r=>r.json()).then(d=>{W=d;render()}).catch(()=>{$("grid").textContent="作品データ(works.json)を読み込めませんでした。index.htmlと同じ場所に置いてください。"});
</script></body></html>
